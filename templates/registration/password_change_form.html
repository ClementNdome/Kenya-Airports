{% extends 'obstacle_compliance/base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-header"><h4 class="mb-0"><i class="fas fa-key me-2"></i>Change Password</h4></div>
        <div class="card-body">
          <p class="text-muted small">Enter your current password and choose a new one.</p>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Change Password</button>
          </form>
          <div class="mt-3 text-center"><a href="{% url 'obstacle_compliance:profile' %}" class="small">Back to Profile</a></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
