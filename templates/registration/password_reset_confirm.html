{% extends 'obstacle_compliance/base.html' %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card">
        <div class="card-header"><h4 class="mb-0"><i class="fas fa-lock me-2"></i>Set New Password</h4></div>
        <div class="card-body">
          {% if validlink %}
            <form method="post">
              {% csrf_token %}
              {{ form.as_p }}
              <button type="submit" class="btn btn-primary w-100">Change Password</button>
            </form>
          {% else %}
            <div class="alert alert-danger">The password reset link is invalid or expired. <a href="{% url 'obstacle_compliance:password_reset' %}">Request a new one</a>.</div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
