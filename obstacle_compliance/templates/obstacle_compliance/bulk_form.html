{% extends 'obstacle_compliance/base.html' %}
{% block title %}Upload CSV{% endblock %}
{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header"><h4 class="mb-0"><i class="fas fa-upload me-2"></i>Upload Properties CSV</h4></div>
        <div class="card-body">
          <p class="text-muted">CSV must have columns: <code>name, latitude, longitude, height_m</code></p>
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Upload</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
