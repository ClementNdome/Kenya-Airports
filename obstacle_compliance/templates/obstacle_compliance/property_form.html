{% extends 'obstacle_compliance/base.html' %}
{% block title %}{% if object %}Edit{% else %}Add{% endif %} Property — KCAA OCS{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4">
                        <i class="fas fa-{% if object %}edit{% else %}plus{% endif %} me-2 text-primary"></i>
                        {% if object %}Edit{% else %}Add{% endif %} Property
                    </h3>
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Property Name *</label>
                                <input type="text" name="name" class="form-control" value="{{ form.name.value|default:'' }}" required placeholder="e.g., Sunset Towers">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Latitude *</label>
                                <input type="number" step="any" name="latitude" class="form-control" value="{{ form.latitude.value|default:'' }}" required placeholder="-1.2864">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Longitude *</label>
                                <input type="number" step="any" name="longitude" class="form-control" value="{{ form.longitude.value|default:'' }}" required placeholder="36.8172">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Height (meters) *</label>
                                <input type="number" step="0.1" name="height_m" class="form-control" value="{{ form.height_m.value|default:'30' }}" required min="0">
                            </div>
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Address</label>
                                <input type="text" name="address" class="form-control" value="{{ form.address.value|default:'' }}" placeholder="Optional street address">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Notes</label>
                            <textarea name="notes" class="form-control" rows="2" placeholder="Optional notes about this property">{{ form.notes.value|default:'' }}</textarea>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'obstacle_compliance:property_list' %}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i>{% if object %}Save Changes{% else %}Add Property{% endif %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
