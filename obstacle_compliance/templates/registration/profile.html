{% extends 'obstacle_compliance/base.html' %}
{% block title %}Profile — KCAA OCS{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4"><i class="fas fa-cog me-2 text-primary"></i>Profile</h3>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Company</label>
                            <input type="text" name="company" class="form-control" value="{{ form.company.value|default:'' }}" placeholder="Your company name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" name="phone" class="form-control" value="{{ form.phone.value|default:'' }}" placeholder="+254 7XX XXX XXX">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Organization Type</label>
                            <select name="organization_type" class="form-select">
                                {% for key, label in form.fields.organization_type.choices %}
                                <option value="{{ key }}" {% if form.organization_type.value == key %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="{% url 'obstacle_compliance:property_list' %}" class="btn btn-outline-secondary ms-2">Back to Properties</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
