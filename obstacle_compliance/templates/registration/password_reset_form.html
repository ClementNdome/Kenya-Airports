{% extends 'obstacle_compliance/base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card">
        <div class="card-header"><h4 class="mb-0"><i class="fas fa-key me-2"></i>Reset Password</h4></div>
        <div class="card-body">
          <p class="text-muted small">Enter your email address and we'll send you instructions to reset your password.</p>
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
          </form>
          <div class="mt-3 text-center"><a href="{% url 'obstacle_compliance:login' %}" class="small">Back to Login</a></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
