{% extends 'obstacle_compliance/base.html' %}
{% block title %}Email Sent{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card">
        <div class="card-body text-center py-5">
          <i class="fas fa-envelope text-primary fa-3x mb-3"></i>
          <h4>Check Your Email</h4>
          <p class="text-muted">If an account with that email exists, we've sent password reset instructions.</p>
          <a href="{% url 'obstacle_compliance:login' %}" class="btn btn-primary">Return to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
